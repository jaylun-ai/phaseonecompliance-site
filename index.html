<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Automated DCAA-compliant timekeeping for SBIR/STTR Phase I teams. 10-second Slack updates translate into audit-ready documentation. Deployed in 48 hours. Phase II Readiness Guarantee." />

       Keeping it privacy-respecting matters for GovTech buyers who check.

<body style="margin: 0; padding: 0; background-color: #050A12;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ── CONFIG ──
    // IMPORTANT: Before deploying, create 3 Stripe payment links and replace the
    // REPLACE_BEFORE_DEPLOY tokens below. These tokens will return a 404 if
    // clicked, which is intentional — it prevents accidentally charging the
    // wrong amount with placeholder/test URLs.

      readinessScore: "#readiness",
      bookCall:       "https://calendly.com/jaylun-phaseonecompliance/15-min-compliance-audit",
      // Flagship: $2,997 one-time setup + $597/mo subscription (recommended product)
      stripeFlagship: "https://buy.stripe.com/00wfZhadgaJQaJdc55aIM03",
      // Quick Start: $2,000 one-time setup + $597/mo subscription
      stripeQuick:    "https://buy.stripe.com/7sY7sL2KO5pwdVp6KLaIM04",
      // Full Coverage: $3,500 one-time setup + $597/mo subscription (includes historical reconstruction)
      stripeFull:     "https://buy.stripe.com/6oU7sL0CGf06g3xc55aIM05",
      // Monthly-only: $597/mo for teams that don't need setup (added post-launch)
      stripeMonthly:  "https://buy.stripe.com/bJeeVdcloaJQ8B52uvaIM06",
      samplePackage:  "/PhaseOne_Sample_Audit_Package.zip",
      tryDemo:        "/demo.html",
    };

    // ── ICONS ──
    const Shield = ({ size = 32 }) => (
      <svg width={size} height={size} viewBox="0 0 32 32" fill="none">
        <path d="M16 2L4 7.5V15C4 23 9.2 30.1 16 31.5C22.8 30.1 28 23 28 15V7.5L16 2Z" fill="url(#sg)" stroke="#3B82F6" strokeWidth="1.2"/>
        <path d="M11 16L14 19L21 12" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        <defs><linearGradient id="sg" x1="16" y1="2" x2="16" y2="31.5"><stop stopColor="#1E3A5F"/><stop offset="1" stopColor="#0C1425"/></linearGradient></defs>
      </svg>
    );
    const Check = () => (
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ flexShrink: 0, marginTop: 3 }}>
        <circle cx="8" cy="8" r="8" fill="#10B981" opacity="0.15"/>
        <path d="M5 8.5L7 10.5L11 6.5" stroke="#10B981" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      </svg>
    );
    const Arrow = () => (
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7H11M11 7L7.5 3.5M11 7L7.5 10.5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
    );
    const Download = ({ size = 14 }) => (
      <svg width={size} height={size} viewBox="0 0 14 14" fill="none"><path d="M7 2V10M7 10L3.5 6.5M7 10L10.5 6.5M2 12H12" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
    );
    const SlackIcon = () => (
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M7.5 2C6.67 2 6 2.67 6 3.5S6.67 5 7.5 5H9V3.5C9 2.67 8.33 2 7.5 2Z" fill="#E01E5A"/>
        <path d="M2 7.5C2 8.33 2.67 9 3.5 9H7.5C8.33 9 9 8.33 9 7.5V3.5C9 2.67 8.33 2 7.5 2" fill="#E01E5A" opacity="0.3"/>
        <path d="M18 7.5C18 6.67 17.33 6 16.5 6S15 6.67 15 7.5V9H16.5C17.33 9 18 8.33 18 7.5Z" fill="#2EB67D"/>
        <path d="M12.5 2C11.67 2 11 2.67 11 3.5V7.5C11 8.33 11.67 9 12.5 9H16.5C17.33 9 18 8.33 18 7.5" fill="#2EB67D" opacity="0.3"/>
        <path d="M12.5 18C13.33 18 14 17.33 14 16.5S13.33 15 12.5 15H11V16.5C11 17.33 11.67 18 12.5 18Z" fill="#ECB22E"/>
        <path d="M18 12.5C18 11.67 17.33 11 16.5 11H12.5C11.67 11 11 11.67 11 12.5V16.5C11 17.33 11.67 18 12.5 18" fill="#ECB22E" opacity="0.3"/>
        <path d="M2 12.5C2 13.33 2.67 14 3.5 14S5 13.33 5 12.5V11H3.5C2.67 11 2 11.67 2 12.5Z" fill="#36C5F0"/>
        <path d="M7.5 18C8.33 18 9 17.33 9 16.5V12.5C9 11.67 8.33 11 7.5 11H3.5C2.67 11 2 11.67 2 12.5" fill="#36C5F0" opacity="0.3"/>
      </svg>
    );

    // ── TYPING ANIMATION ──
    function TypingDemo() {
      const [step, setStep] = useState(0);
      const [typed, setTyped] = useState("");
      const [showResult, setShowResult] = useState(false);
      const engineerInput = "fixed backend api, pushed to staging";
      const dcaaOutput = "Performed integration testing and secure deployment of backend API endpoint for Project ATLAS data processing module. Updated staging environment per system security plan requirements. Time: 2.5 hrs, Direct Labor, CLIN 0001.";
      useEffect(() => {
        const timer = setTimeout(() => {
          if (step === 0) {
            if (typed.length < engineerInput.length) setTyped(engineerInput.slice(0, typed.length + 1));
            else setTimeout(() => setStep(1), 800);
          }
          if (step === 1) { setShowResult(true); setTimeout(() => setStep(2), 4000); }
          if (step === 2) { setStep(0); setTyped(""); setShowResult(false); }
        }, step === 0 ? 55 : 100);
        return () => clearTimeout(timer);
      }, [step, typed]);
      return (
        <div style={{ background: "rgba(15,23,42,0.7)", border: "1px solid rgba(59,130,246,0.15)", borderRadius: 12, overflow: "hidden" }}>
          <div style={{ padding: "16px 20px", borderBottom: "1px solid rgba(59,130,246,0.08)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <SlackIcon />
              <span style={{ fontSize: 12, color: "#64748B", fontFamily: "'Space Mono', monospace", letterSpacing: "0.5px" }}>ENGINEER'S SLACK UPDATE</span>
            </div>
            <div style={{ background: "rgba(0,0,0,0.3)", borderRadius: 8, padding: "12px 16px", fontFamily: "'Space Mono', monospace", fontSize: 14, color: "#94A3B8", minHeight: 20 }}>
              {typed}<span style={{ opacity: step === 0 ? 1 : 0, animation: "blink 1s infinite" }}>|</span>
            </div>
          </div>
          <div style={{ padding: "16px 20px", position: "relative" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
              <Shield size={18} />
              <span style={{ fontSize: 12, color: "#3B82F6", fontFamily: "'Space Mono', monospace", letterSpacing: "0.5px" }}>DCAA-COMPLIANT OUTPUT</span>
              {showResult && <span style={{ fontSize: 10, color: "#10B981", marginLeft: "auto", fontFamily: "'Space Mono', monospace" }}>✓ AUDIT-READY</span>}
            </div>
            <div style={{
              background: showResult ? "rgba(59,130,246,0.05)" : "rgba(0,0,0,0.15)",
              borderRadius: 8, padding: "12px 16px", minHeight: 60,
              border: showResult ? "1px solid rgba(59,130,246,0.15)" : "1px solid rgba(255,255,255,0.03)",
              transition: "all 0.5s ease",
            }}>
              {showResult
                ? <p style={{ fontSize: 13, color: "#CBD5E1", lineHeight: 1.65, fontFamily: "'DM Sans', sans-serif", margin: 0 }}>{dcaaOutput}</p>
                : <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ width: 6, height: 6, borderRadius: "50%", background: "#3B82F6", animation: "pulse 1.5s infinite" }} />
                    <span style={{ fontSize: 12, color: "#475569" }}>Waiting for engineer input...</span>
                  </div>}
            </div>
          </div>
        </div>
      );
    }

    // ── ROI CALCULATOR ──
    function ROICalculator() {
      const [teamSize, setTeamSize] = useState(6);
      const [hourlyRate, setHourlyRate] = useState(75);
      const [minutesPerDay, setMinutesPerDay] = useState(15);

      const workDays = 250;
      const annualHoursWasted = useMemo(() => (teamSize * minutesPerDay * workDays) / 60, [teamSize, minutesPerDay]);
      const annualCostWasted = useMemo(() => annualHoursWasted * hourlyRate, [annualHoursWasted, hourlyRate]);
      const phaseoneYear1Cost = 597 * 12 + 2997; // setup + 12 months
      const phaseoneOngoingCost = 597 * 12;     // year 2+ recurring only
      const netYear1Savings = annualCostWasted - phaseoneYear1Cost;
      const roiMultipleOngoing = useMemo(
        () => annualCostWasted > 0 && phaseoneOngoingCost > 0
          ? (annualCostWasted / phaseoneOngoingCost).toFixed(1)
          : "—",
        [annualCostWasted]
      );
      const paybackDays = annualCostWasted > 0
        ? Math.max(1, Math.round((phaseoneYear1Cost / (annualCostWasted / 365))))
        : "—";
      const fmt = n => "$" + Math.round(n).toLocaleString();

      return (
        <div style={{
          background: "linear-gradient(180deg, rgba(30,58,95,0.25), rgba(15,23,42,0.6))",
          border: "1px solid rgba(59,130,246,0.18)", borderRadius: 16,
          padding: "32px 32px 28px",
          boxShadow: "0 0 60px rgba(59,130,246,0.06)",
        }}>
          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <p style={{ fontFamily: "'Space Mono',monospace", fontSize: 11, color: "#3B82F6", letterSpacing: "2px", textTransform: "uppercase", marginBottom: 6 }}>ROI Calculator</p>
            <h3 style={{ fontSize: 22, fontWeight: 700, color: "white", marginBottom: 4 }}>What Timesheets Actually Cost Your Team</h3>
            <p style={{ fontSize: 13, color: "#94A3B8" }}>Most DCAA-compliant timesheet tools cost $8/user/month. That's not the expensive part.</p>
          </div>

          {/* Sliders */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 20, marginBottom: 28 }}>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <label style={{ fontSize: 12, color: "#94A3B8", fontFamily: "'Space Mono',monospace", letterSpacing: "0.5px", textTransform: "uppercase" }}>Team Size (engineers)</label>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#60A5FA", fontFamily: "'Space Mono',monospace" }}>{teamSize}</span>
              </div>
              <input
                type="range" min="3" max="15" step="1" value={teamSize}
                onChange={e => setTeamSize(parseInt(e.target.value))}
                style={{ width: "100%", accentColor: "#3B82F6" }}
              />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#475569", fontFamily: "'Space Mono',monospace", marginTop: 2 }}>
                <span>3</span><span>15</span>
              </div>
            </div>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <label style={{ fontSize: 12, color: "#94A3B8", fontFamily: "'Space Mono',monospace", letterSpacing: "0.5px", textTransform: "uppercase" }}>Avg Hourly Cost</label>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#60A5FA", fontFamily: "'Space Mono',monospace" }}>${hourlyRate}/hr</span>
              </div>
              <input
                type="range" min="50" max="150" step="5" value={hourlyRate}
                onChange={e => setHourlyRate(parseInt(e.target.value))}
                style={{ width: "100%", accentColor: "#3B82F6" }}
              />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#475569", fontFamily: "'Space Mono',monospace", marginTop: 2 }}>
                <span>$50</span><span>$150</span>
              </div>
            </div>
            <div>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                <label style={{ fontSize: 12, color: "#94A3B8", fontFamily: "'Space Mono',monospace", letterSpacing: "0.5px", textTransform: "uppercase" }}>Min / Day on Timesheets</label>
                <span style={{ fontSize: 14, fontWeight: 600, color: "#60A5FA", fontFamily: "'Space Mono',monospace" }}>{minutesPerDay} min</span>
              </div>
              <input
                type="range" min="5" max="30" step="1" value={minutesPerDay}
                onChange={e => setMinutesPerDay(parseInt(e.target.value))}
                style={{ width: "100%", accentColor: "#3B82F6" }}
              />
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, color: "#475569", fontFamily: "'Space Mono',monospace", marginTop: 2 }}>
                <span>5</span><span>30</span>
              </div>
            </div>
          </div>

          {/* Output Grid */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(170px, 1fr))", gap: 12, marginBottom: 20 }}>
            {[
              { l: "Hours Lost / Year", v: Math.round(annualHoursWasted).toLocaleString(), unit: "hrs", color: "#F59E0B" },
              { l: "Productivity Wasted", v: fmt(annualCostWasted), color: "#EF4444" },
              { l: "PhaseOne Year 1 Cost", v: fmt(phaseoneYear1Cost), color: "#94A3B8" },
              { l: "Year 1 Net Savings", v: fmt(netYear1Savings), color: "#10B981" },
            ].map((c, i) => (
              <div key={i} style={{
                background: "rgba(0,0,0,0.25)", border: "1px solid rgba(59,130,246,0.1)",
                borderRadius: 10, padding: "14px 16px", textAlign: "center",
              }}>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 10, color: "#64748B", letterSpacing: "0.5px", textTransform: "uppercase", marginBottom: 6 }}>
                  {c.l}
                </div>
                <div style={{ fontFamily: "'Space Mono',monospace", fontSize: 22, fontWeight: 700, color: c.color }}>
                  {c.v}{c.unit ? <span style={{ fontSize: 12, color: "#64748B", marginLeft: 4 }}>{c.unit}</span> : null}
                </div>
              </div>
            ))}
          </div>

          <div style={{
            textAlign: "center", fontSize: 14, color: "#CBD5E1",
            padding: "10px 0", borderTop: "1px solid rgba(59,130,246,0.08)",
          }}>
            PhaseOne pays for itself in <strong style={{ color: "#10B981" }}>{paybackDays} days</strong>. In Year 2 and beyond (no setup fee), every $1 spent on PhaseOne returns <strong style={{ color: "white" }}>${roiMultipleOngoing}</strong> in recovered engineering productivity.
          </div>
        </div>
      );
    }

    // ── FAQ DATA ──
    const faqs = [
      { q: "How is this different from Hour Timesheet, WeWorked, or other DCAA timesheet tools?",
        a: "Those tools digitize timesheets — your engineers still manually fill out forms, select labor categories from dropdowns, and type compliant descriptions themselves. Most engineers don't do it consistently, which is why timekeeping is the #1 DCAA audit finding. PhaseOne eliminates the timesheet entirely. Engineers type a natural Slack message, and our AI handles the DCAA translation, CLIN mapping, and compliance scoring automatically." },
      { q: "Why $597/month instead of $8/user/month like other tools?",
        a: "A $48/month timesheet tool records whatever your engineer types — including non-compliant entries that will fail an audit. PhaseOne doesn't just record time — it translates natural language into DCAA-ready documentation, flags unallowable costs automatically, runs weekly compliance audits, and monitors your contract burn rate. Plus, the 15 minutes/day your engineers save on timesheets is worth ~$28,000/year in recovered productivity. Use the ROI calculator above." },
      { q: "How is this different from Deltek or Unanet?",
        a: "Those are enterprise ERPs designed for 500-person defense contractors — they cost $50K+ to implement and take months. We're built specifically for Phase I SBIR teams: 48-hour deployment, zero training required, and your engineers never leave Slack." },
      { q: "What if I'm already 30–60 days into my award?",
        a: "That's exactly what our Full Coverage package handles. We backfill your compliance documentation from Day 1 of your award — no gaps, no audit risk." },
      { q: "Does DCAA even audit Phase I?",
        a: "Phase I awards are typically firm-fixed-price, so direct DCAA audits during Phase I execution are rare. The pressure hits at Phase II — where awards reach $1.5M+ and a Standard Form 1408 pre-award accounting system survey is triggered before funds are obligated. Teams that start compliance habits during Phase I walk into Phase II with a strong posture. Teams that scramble at submission time typically face 60–120 day award delays." },
      { q: "How is this different from hiring an accountant?",
        a: "Traditional DCAA accountants handle your books — which is important. We handle the engineering-side compliance that accountants can't: daily timekeeping capture, AI translation to audit-ready language, real-time compliance scoring, and automatic unallowable cost detection. We complement your accountant, not replace them." },
      { q: "What compliance frameworks do you cover?",
        a: "DCAA timekeeping requirements, FAR Part 31 cost principles, SF-1408 pre-award survey alignment, unallowable cost detection under FAR 31.205, and daily labor distribution standards. We cover DoD, NSF, NASA, NIH, DOE, and DHHS SBIR/STTR programs." },
      { q: "Can I cancel the monthly subscription anytime?",
        a: "Yes, month-to-month after setup. No annual contract required. Annual prepay is available at 15% discount if you prefer." },
      { q: "What's the Phase II Readiness Guarantee?",
        a: "If your SF-1408 pre-award survey flags timekeeping as a finding during your first 12 months as a PhaseOne client, we refund your full setup fee and continue running your system at no charge until it passes. Details on the Pricing section." },
    ];

    // ════════════════════════════════════════════════════════
    function PhaseOnePage() {
      const [activeFaq, setActiveFaq] = useState(null);
      const [mobileNavOpen, setMobileNavOpen] = useState(false);
      return (
        <div style={{ background: "#050A12", color: "#E2E8F0", fontFamily: "'DM Sans', -apple-system, system-ui, sans-serif", minHeight: "100vh", overflow: "hidden" }}>
          {/* GLOBAL STYLES */}
          <style>{`
            @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

            html { scroll-behavior: smooth; }
            body { margin: 0; }
            @keyframes blink { 50% { opacity: 0; } }
            @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
            @keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.4); } 50% { box-shadow: 0 0 0 8px rgba(59,130,246,0); } }
            @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
            .fade-up { animation: fadeUp 0.8s ease-out backwards; }
            .fade-up.d1 { animation-delay: 0.05s; }
            .fade-up.d2 { animation-delay: 0.15s; }
            .fade-up.d3 { animation-delay: 0.25s; }
            .fade-up.d4 { animation-delay: 0.35s; }
            .fade-up.d5 { animation-delay: 0.45s; }

              background: rgba(15,23,42,0.4); border: 1px solid rgba(59,130,246,0.08);
              border-radius: 12px; padding: 28px; transition: all 0.25s ease;
            }
            .card:hover { border-color: rgba(59,130,246,0.2); transform: translateY(-2px); }

              display: inline-flex; align-items: center; gap: 8px; justify-content: center;
              padding: 14px 28px; border-radius: 10px; font-weight: 600; font-size: 14px;
              text-decoration: none; transition: all 0.2s; cursor: pointer; border: none;
              font-family: inherit;
            }
            .btn-primary {
              background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); color: white;
              box-shadow: 0 4px 14px rgba(59,130,246,0.25);
            }
            .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.35); }
            .btn-secondary {
              background: rgba(59,130,246,0.08); color: #CBD5E1;
              border: 1px solid rgba(59,130,246,0.25);
            }
            .btn-secondary:hover { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.12); }

              background: transparent; color: #94A3B8; border: 1px solid rgba(148,163,184,0.2);
            }
            .btn-ghost:hover { color: #E2E8F0; border-color: rgba(148,163,184,0.4); }
            .badge {
              display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
              border-radius: 100px; font-family: 'Space Mono', monospace; font-size: 11px;
              letter-spacing: 0.5px;
            }
            input[type=range] { height: 6px; border-radius: 3px; background: rgba(59,130,246,0.15); outline: none; }
            input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; height: 18px; width: 18px; border-radius: 50%; background: #3B82F6; cursor: pointer; box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }
            input[type=range]::-moz-range-thumb { height: 18px; width: 18px; border-radius: 50%; background: #3B82F6; cursor: pointer; border: none; box-shadow: 0 0 0 4px rgba(59,130,246,0.2); }

            /* Nav responsive: show hamburger under 760px, hide desktop links */
            .nav-links-desktop { display: flex; gap: 28px; align-items: center; }
            .nav-links-mobile { display: none; }
            @media (max-width: 760px) {
              .nav-links-desktop { display: none !important; }
              .nav-hamburger { display: inline-flex !important; }
              .nav-links-mobile { display: flex !important; }
              .sec { padding: 0 18px; }
            }
          `}</style>

          {/* NAV */}
          <nav style={{ padding: "18px 0", borderBottom: "1px solid rgba(59,130,246,0.06)", position: "sticky", top: 0, background: "rgba(5,10,18,0.85)", backdropFilter: "blur(10px)", zIndex: 50 }}>
            <div className="sec" style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <a href="#" style={{ display: "flex", alignItems: "center", gap: 10, textDecoration: "none" }}>
                <Shield size={22} />
                <span style={{ fontSize: 16, fontWeight: 700, color: "white" }}>PhaseOne <span style={{ color: "#3B82F6" }}>Compliance</span></span>
              </a>
              <div className="nav-links-desktop">
                <a href="#how" style={{ fontSize: 13, color: "#94A3B8", textDecoration: "none" }}>How It Works</a>
                <a href="#sample" style={{ fontSize: 13, color: "#94A3B8", textDecoration: "none" }}>Sample Outputs</a>
                <a href="#pricing" style={{ fontSize: 13, color: "#94A3B8", textDecoration: "none" }}>Pricing</a>
                <a href="#faq" style={{ fontSize: 13, color: "#94A3B8", textDecoration: "none" }}>FAQ</a>
                <a href={LINKS.bookCall} className="btn btn-primary" style={{ padding: "10px 18px", fontSize: 13 }}>Book a Call</a>
              </div>
              <button
                className="nav-hamburger"
                onClick={() => setMobileNavOpen(!mobileNavOpen)}
                aria-label="Toggle menu"
                style={{

              </div>
              <p style={{ fontSize: 13, color: "#CBD5E1", lineHeight: 1.65, marginBottom: 14 }}>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(260px, 1fr))", gap: 8, marginBottom: 14 }}>

                  "Provisional indirect rate memorandum (CPA-reviewed)",
                  "Multi-CLIN labor distribution configuration",
                  "Monthly cost voucher template + test voucher",
                  "ICS submission prep (FY-end reconciliation)",

                borderRadius: 10, fontSize: 13, color: "#94A3B8", fontFamily: "'Space Mono',monospace", letterSpacing: "0.5px",
                textAlign: "center", listStyle: "none",
              }}>
                OTHER DEPLOYMENT OPTIONS (click to expand)

              <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginTop: 16 }}>
                <div className="card" style={{ flex: "1 1 280px", padding: 24 }}>
                  <h4 style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Quick Start</h4>
                  <p style={{ fontSize: 12, color: "#64748B", marginBottom: 12 }}>For teams in the first 30 days of Phase I</p>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 14 }}>
                    <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 30, fontWeight: 700, color: "white" }}>$2,000</span>
                    <span style={{ fontSize: 13, color: "#64748B" }}>setup + $597/mo</span>
                  </div>
                  <p style={{ fontSize: 12, color: "#94A3B8", lineHeight: 1.5, marginBottom: 14 }}>
                    Full deployment. Compliance starts from Day 1 of your award going forward.
                  </p>
                  <a href={LINKS.stripeQuick} className="btn btn-secondary" style={{ width: "100%", fontSize: 13 }}>Quick Start</a>
                </div>
                <div className="card" style={{ flex: "1 1 280px", padding: 24 }}>
                  <h4 style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Full Coverage</h4>
                  <p style={{ fontSize: 12, color: "#64748B", marginBottom: 12 }}>For teams 30–90 days post-award</p>

                    <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 30, fontWeight: 700, color: "white" }}>$3,500</span>
                    <span style={{ fontSize: 13, color: "#64748B" }}>setup + $597/mo</span>
                  </div>
                  <p style={{ fontSize: 12, color: "#94A3B8", lineHeight: 1.5, marginBottom: 14 }}>
                    Includes historical reconstruction back to Day 1 of award + gap analysis + remediation.
                  </p>
                  <a href={LINKS.stripeFull} className="btn btn-secondary" style={{ width: "100%", fontSize: 13 }}>Full Coverage</a>
                </div>
                <div className="card" style={{ flex: "1 1 280px", padding: 24 }}>
                  <h4 style={{ fontSize: 16, fontWeight: 700, marginBottom: 4 }}>Monthly Only</h4>
                  <p style={{ fontSize: 12, color: "#64748B", marginBottom: 12 }}>For teams with existing compliance infrastructure</p>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 6, marginBottom: 14 }}>
                    <span style={{ fontFamily: "'Space Mono',monospace", fontSize: 30, fontWeight: 700, color: "white" }}>$597</span>
                    <span style={{ fontSize: 13, color: "#64748B" }}>/month · no setup</span>

                  </p>
                  <a href={LINKS.stripeMonthly} className="btn btn-secondary" style={{ width: "100%", fontSize: 13 }}>Monthly Only</a>
                </div>
              </div>
            </details>
          </section>

          {/* FAQ */}
          <section id="faq" className="sec" style={{ marginBottom: 70 }}>
            <div style={{ textAlign: "center", marginBottom: 32 }}>
              <p style={{ fontFamily: "'Space Mono',monospace", fontSize: 12, color: "#3B82F6", letterSpacing: "2px", textTransform: "uppercase", marginBottom: 6 }}>FAQ</p>
              <h2 style={{ fontSize: "clamp(24px,3.5vw,32px)", fontWeight: 700, letterSpacing: "-0.02em" }}>Common Questions</h2>
            </div>
            <div style={{ maxWidth: 680, margin: "0 auto", display: "flex", flexDirection: "column", gap: 10 }}>
              {faqs.map((faq, i) => (
                <div key={i} onClick={() => setActiveFaq(activeFaq === i ? null : i)} style={{
                  background: "rgba(15,23,42,0.4)", border: "1px solid rgba(59,130,246,0.08)", borderRadius: 10,
                  cursor: "pointer", transition: "border-color 0.2s",
                  ...(activeFaq === i ? { borderColor: "rgba(59,130,246,0.25)" } : {}),
                }}>
                  <div style={{ padding: "16px 22px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <span style={{ fontWeight: 500, fontSize: 14, color: "#E2E8F0", paddingRight: 14 }}>{faq.q}</span>
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style={{ transform: activeFaq === i ? "rotate(180deg)" : "rotate(0)", transition: "transform 0.2s", flexShrink: 0 }}>
                      <path d="M4.5 6.75L9 11.25L13.5 6.75" stroke="#64748B" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>
                  {activeFaq === i && (
                    <div style={{ padding: "0 22px 16px", fontSize: 14, color: "#94A3B8", lineHeight: 1.7 }}>{faq.a}</div>

          <section id="readiness" style={{
            borderTop: "1px solid rgba(59,130,246,0.08)",

            padding: "60px 0 70px", textAlign: "center",
          }}>
            <div className="sec">
              <Shield size={36} />
              <h2 style={{ fontSize: "clamp(26px,4vw,36px)", fontWeight: 700, margin: "18px 0 10px", letterSpacing: "-0.02em" }}>
                Get Ready for Phase II<br/>Before the Pressure Hits.
              </h2>
              <p style={{ fontSize: 16, color: "#94A3B8", maxWidth: 520, margin: "0 auto 28px", lineHeight: 1.6 }}>
                Takes 2 minutes. You'll receive a personalized Phase II Readiness Score by email.
              </p>

              <div style={{ maxWidth: 800, margin: "0 auto 40px" }}>
                <iframe
                  src="https://tally.so/r/Np0R8G?transparentBackground=1"

                  title="Phase II Readiness Score" />

              <div style={{ display: "flex", gap: 14, justifyContent: "center", flexWrap: "wrap" }}>
                <a href={LINKS.bookCall} className="btn btn-primary" style={{ fontSize: 17, padding: "18px 44px" }}>
                  Book a 15-Min Phase II Readiness Check <Arrow />

            </div>
          </section>

          {/* FOOTER */}
          <footer style={{ borderTop: "1px solid rgba(59,130,246,0.05)", padding: "24px 0" }}>

              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <Shield size={18} />
                <span style={{ fontSize: 13, fontWeight: 600 }}>PhaseOne Compliance</span>
              </div>
              <div style={{ display: "flex", gap: 20, alignItems: "center", flexWrap: "wrap" }}>
                <a href="/terms.html" style={{ fontSize: 11, color: "#64748B", textDecoration: "none" }}>Terms of Service</a>
                <a href="mailto:jaylun@phaseonecompliance.com" style={{ fontSize: 11, color: "#64748B", textDecoration: "none" }}>jaylun@phaseonecompliance.com</a>
                <p style={{ fontSize: 11, color: "#334155", margin: 0 }}>© {new Date().getFullYear()} PhaseOne Compliance</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PhaseOnePage />);
  </script>
